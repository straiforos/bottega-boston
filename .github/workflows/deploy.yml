name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  # OpenTofu S3 backend → R2
  AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
  AWS_EC2_METADATA_DISABLED: 'true'
  TF_STATE_BUCKET: bottega-tfstate

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.9.0

      - name: Install
        run: bun install --frozen-lockfile

      - name: Ensure Terraform state bucket
        run: |
          set +e
          OUT="$(bunx wrangler r2 bucket create "${TF_STATE_BUCKET}" 2>&1)"
          CODE=$?
          set -e
          printf '%s\n' "$OUT"
          if [ "$CODE" -eq 0 ]; then
            echo "Created R2 bucket ${TF_STATE_BUCKET}"
            exit 0
          fi
          if printf '%s' "$OUT" | grep -qiE 'already exists|A bucket with that name already exists'; then
            echo "${TF_STATE_BUCKET} already exists; continuing"
            exit 0
          fi
          if printf '%s' "$OUT" | grep -q '10042'; then
            echo "::error::R2 is not enabled on this Cloudflare account (API 10042)."
            echo "Open https://dash.cloudflare.com → Storage & databases → R2 → Overview"
            echo "and complete Add R2 subscription (payment method required; free tier is \$0)."
            exit 1
          fi
          echo "::error::Failed to create R2 bucket ${TF_STATE_BUCKET} (exit $CODE)"
          exit 1

      - name: Probe R2 S3 endpoint TLS
        run: |
          ACCOUNT_ID="${CLOUDFLARE_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID secret required}"
          # Prefer the dashboard S3 endpoint secret when it is already the account host.
          RAW="${{ secrets.S3_ENDPOINT }}"
          RAW="${RAW%/}"
          if [[ "$RAW" =~ ^https://[a-f0-9]{32}\.r2\.cloudflarestorage\.com$ ]]; then
            ENDPOINT="$RAW"
          else
            ENDPOINT="https://${ACCOUNT_ID}.r2.cloudflarestorage.com"
          fi
          echo "R2_S3_ENDPOINT=${ENDPOINT}" >> "$GITHUB_ENV"
          echo "Probing ${ENDPOINT}"
          set +e
          CURL_OUT="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 20 "${ENDPOINT}/" 2>&1)"
          CURL_CODE=$?
          set -e
          if [ "$CURL_CODE" -ne 0 ]; then
            echo "::error::R2 S3 endpoint TLS/connect failed (${CURL_OUT})."
            echo "Confirm CLOUDFLARE_ACCOUNT_ID is the account id from dash.cloudflare.com / R2 Overview"
            echo "(not an R2 access key id). Fresh R2 subscriptions sometimes need hours for the"
            echo "per-account cert; curl -vI ${ENDPOINT} should return HTTP 4xx once ready."
            exit 1
          fi
          echo "R2 S3 endpoint reachable (HTTP ${CURL_OUT})"

      - name: OpenTofu init
        working-directory: infra/cloudflare
        run: |
          export AWS_ENDPOINT_URL_S3="${R2_S3_ENDPOINT}"
          tofu init -input=false -reconfigure \
            -backend-config="endpoints={s3=\"${R2_S3_ENDPOINT}\"}" \
            -backend-config="use_path_style=true"

      - name: Provision D1 and R2
        working-directory: infra/cloudflare
        run: |
          export AWS_ENDPOINT_URL_S3="${R2_S3_ENDPOINT}"
          tofu apply -input=false -auto-approve -var='manage_dns=false'

      - name: Render Wrangler config
        working-directory: infra/cloudflare
        run: |
          D1_DATABASE_ID="$(tofu output -raw d1_database_id)"
          echo "D1_DATABASE_ID=$D1_DATABASE_ID" >> "$GITHUB_ENV"
          cd ../..
          D1_DATABASE_ID="$D1_DATABASE_ID" node scripts/render-wrangler-config.mjs

      - name: Build
        env:
          VITE_LOVABLE_CONNECTOR_GOOGLE_MAPS_BROWSER_KEY: ${{ secrets.GOOGLE_MAPS_BROWSER_KEY }}
          CLOUDFLARE_INCLUDE_PROCESS_ENV: 'true'
        run: bun run build

      - name: Patch deploy Wrangler config
        run: WRANGLER_CONFIG_MODE=dist D1_DATABASE_ID="$D1_DATABASE_ID" node scripts/render-wrangler-config.mjs

      - name: Apply D1 migrations
        run: bunx wrangler d1 migrations apply bottega --remote --config wrangler.ci.json

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Vite + @cloudflare/vite-plugin emit a no_bundle Worker under dist/server.
          # Deploy that artifact — do not rebundle src/worker.ts (TanStack virtual imports).
          command: deploy --config dist/server/wrangler.json

      - name: Write Worker secrets
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: |
          python3 - <<'PY' > /tmp/bottega-secrets.json
          import json, os
          keys = [
            "CRON_SECRET",
            "GOOGLE_CLIENT_ID",
            "GOOGLE_CLIENT_SECRET",
            "RESEND_API_KEY",
            "RESEND_WEBHOOK_SECRET",
            "S3_ACCESS_KEY_ID",
            "S3_ENDPOINT",
            "S3_SECRET_ACCESS_KEY",
            "TURNSTILE_SECRET_KEY",
            "TURNSTILE_SITE_KEY",
            "R2_PUBLIC_BASE_URL",
          ]
          print(json.dumps({k: os.environ[k] for k in keys if os.environ.get(k)}))
          PY
          bunx wrangler secret bulk /tmp/bottega-secrets.json --config dist/server/wrangler.json
          rm -f /tmp/bottega-secrets.json

      - name: Clear conflicting apex DNS
        run: node scripts/clear-apex-dns-for-workers.mjs
        env:
          ZONE_NAME: bottega.boston

      - name: Attach custom domain
        working-directory: infra/cloudflare
        run: |
          export AWS_ENDPOINT_URL_S3="${R2_S3_ENDPOINT}"
          tofu apply -input=false -auto-approve -var='manage_dns=true'
