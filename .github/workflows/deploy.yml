name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  # OpenTofu S3 backend → R2 (account endpoint only; bucket hostnames break TLS)
  AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
  AWS_EC2_METADATA_DISABLED: 'true'

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.9.0

      - name: Install
        run: bun install --frozen-lockfile

      - name: Ensure Terraform state bucket
        run: |
          # Idempotent: succeed whether the bucket is new or already present.
          if bunx wrangler r2 bucket create bottega-tfstate; then
            echo "Created R2 bucket bottega-tfstate"
          else
            echo "bottega-tfstate already exists (or create returned non-zero); continuing"
          fi

      - name: OpenTofu init
        working-directory: infra/cloudflare
        run: |
          ACCOUNT_ID="${CLOUDFLARE_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID secret required}"
          # Must be https://<accountid>.r2.cloudflarestorage.com — not a bucket
          # subdomain and not S3_ENDPOINT if that value is virtual-hosted or Spaces.
          ENDPOINT="https://${ACCOUNT_ID}.r2.cloudflarestorage.com"
          echo "Using R2 state endpoint ${ENDPOINT}"
          export AWS_ENDPOINT_URL_S3="${ENDPOINT}"
          tofu init -input=false -reconfigure \
            -backend-config="endpoints={s3=\"${ENDPOINT}\"}" \
            -backend-config="use_path_style=true"

      - name: Provision D1 and R2
        working-directory: infra/cloudflare
        run: tofu apply -input=false -auto-approve -var='manage_dns=false'

      - name: Render Wrangler config
        working-directory: infra/cloudflare
        run: |
          D1_DATABASE_ID="$(tofu output -raw d1_database_id)"
          echo "D1_DATABASE_ID=$D1_DATABASE_ID" >> "$GITHUB_ENV"
          cd ../..
          D1_DATABASE_ID="$D1_DATABASE_ID" node scripts/render-wrangler-config.mjs

      - name: Build
        env:
          VITE_LOVABLE_CONNECTOR_GOOGLE_MAPS_BROWSER_KEY: ${{ secrets.GOOGLE_MAPS_BROWSER_KEY }}
          CLOUDFLARE_INCLUDE_PROCESS_ENV: 'true'
        run: bun run build

      - name: Write Worker secrets
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: |
          python3 - <<'PY' > /tmp/bottega-secrets.json
          import json, os
          keys = [
            "CRON_SECRET",
            "GOOGLE_CLIENT_ID",
            "GOOGLE_CLIENT_SECRET",
            "RESEND_API_KEY",
            "RESEND_WEBHOOK_SECRET",
            "S3_ACCESS_KEY_ID",
            "S3_ENDPOINT",
            "S3_SECRET_ACCESS_KEY",
            "TURNSTILE_SECRET_KEY",
            "TURNSTILE_SITE_KEY",
            "R2_PUBLIC_BASE_URL",
          ]
          print(json.dumps({k: os.environ[k] for k in keys if os.environ.get(k)}))
          PY
          bunx wrangler secret bulk /tmp/bottega-secrets.json --config wrangler.ci.json
          rm -f /tmp/bottega-secrets.json

      - name: Apply D1 migrations
        run: bunx wrangler d1 migrations apply bottega --remote --config wrangler.ci.json

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.ci.json

      - name: Attach custom domain
        working-directory: infra/cloudflare
        run: |
          ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          export AWS_ENDPOINT_URL_S3="${ENDPOINT}"
          tofu apply -input=false -auto-approve -var='manage_dns=true'
